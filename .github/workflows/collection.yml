name: Scheduled price checks
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/collection.yml
      - apps/worker/**
      - packages/jobs/**
      - scripts/wake-worker.mjs
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: price-collection
  cancel-in-progress: false
jobs:
  resume-render:
    if: vars.ATLAS_SCHEDULE_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/wake-worker.mjs
  collect:
    if: vars.ATLAS_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_MODE: live
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
      SCRAPER_PROVIDER: scrapingbee
      SCRAPER_PREMIUM_PROXY: ${{ vars.SCRAPER_PREMIUM_PROXY || 'false' }}
      SCRAPER_REQUESTS_PER_DAY: ${{ vars.SCRAPER_REQUESTS_PER_DAY || '1000' }}
      SCRAPER_DIRECT_FIRST: 'true'
      SCRAPER_CREDITS_PER_DAY: ${{ vars.SCRAPER_CREDITS_PER_DAY || '100' }}
      SCRAPER_CREDITS_PER_MONTH: ${{ vars.SCRAPER_CREDITS_PER_MONTH || '300' }}
      SCRAPER_MAX_CREDITS: '10'
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM || 'onboarding@resend.dev' }}
      EMAIL_LINK_ORIGIN: https://price-atlas-ashen.vercel.app
      UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm worker:once
