name: Price history backfill
# Real past prices from public sources, written as history-only points:
#  - Internet Archive captures of the exact retailer product pages (all stores)
#  - Keepa amazon.in history, when KEEPA_API_KEY is configured
# GitHub's runners can reach web.archive.org; Vercel and the dev sandbox cannot.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Listings to probe in the archive
        default: '20'
  schedule:
    - cron: '41 21 * * *' # 03:11 IST daily
permissions:
  contents: read
concurrency:
  group: history-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_MODE: live
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
      LISTING_LIMIT: ${{ inputs.limit || '20' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Check configuration
        run: |
          test -n "$DATABASE_URL" || (echo "Add the DATABASE_URL repository secret." && exit 1)
          [[ "$LISTING_LIMIT" =~ ^[0-9]+$ ]] && (( LISTING_LIMIT >= 1 && LISTING_LIMIT <= 200 )) || (echo "Limit must be an integer from 1 to 200." && exit 1)
      - name: Internet Archive dry run (validated, no writes)
        id: archive
        continue-on-error: true
        run: pnpm backfill:wayback --limit="$LISTING_LIMIT" --days=30 --max-requests=100
      - name: Save validated archive prices as history
        if: steps.archive.outcome == 'success'
        run: pnpm backfill:wayback --apply
      - name: Keepa amazon.in history
        if: env.KEEPA_API_KEY != ''
        run: pnpm backfill:keepa
      - name: Report archive failure
        if: always() && steps.archive.outcome == 'failure'
        run: |
          echo "Archive check failed. No archive prices were applied. Inspect the uploaded report."
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wayback-report
          path: data/wayback/
          if-no-files-found: ignore
